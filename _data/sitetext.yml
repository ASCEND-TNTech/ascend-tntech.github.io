    body: "ASCEND undertakes and enables use-inspired, impactful research and advanced development in high-performance computing and communication, cloud computing and quantum information science—in collaboration with professors, staff and students across Tennessee Tech.<br><br> ASCEND leads Tennessee Tech forward with enabling technology by the acquisition, management, deployment and responsible stewardship of advanced, often experimental, computational, data and quantum resources delivered to Tennessee Tech people and their collaborators with user-centric processes, usable security and high quality.<br><br> The center supports experiential learning for students and outreach to its community and to appropriate and timely transition of its key innovative outcomes to industry, academia and government through partnership, sharing, standardization and entrepreneurship and commercialization."
