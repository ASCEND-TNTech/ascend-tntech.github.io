<!-- Team -->
<section class="bg-light page-section" id="{{ site.data.sitetext[site.locale].team.section | default: team }}">
<div class="container">
  <div class="row">
	<div class="col-lg-12 text-center">
	  <h2 class="section-heading text-uppercase">{{ site.data.sitetext[site.locale].team.title }}</h2>
	</div>
  </div>
  
  {% for team in site.data.sitetext[site.locale].team.people %}
	<div class="row">
		<div class="col-lg-12 text-center">
		  <h3 class="section-heading text-muted">{{ team.category }}</h3>
		</div>
	</div>
	
        <div class="row justify-content-center">
		{% for person in team.members %}
		<div class="col-sm-4">
			<div class="team-member">
				<img class="mx-auto rounded-circle" src="assets/img/team/{{ person.name }}.jpg" alt="Picture of {{ person.name }}">
				<h4>{{ person.name }}</h4>
				<p class="text-muted">{{ person.role }}</p>
				<ul class="list-inline social-buttons">
				  <li class="list-inline-item">
					<a href="mailto:{{ person.email }}">
					  <i class="fas fa-envelope"></i>
					</a>
				  </li>
				</ul>
			</div>
		</div>
		{% endfor %}
       </div>
  {% endfor %}
</div>
</section>
<!-- End Team -->
